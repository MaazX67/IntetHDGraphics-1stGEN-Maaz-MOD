name: Build MaazXGPU Full Driver

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Vulkan SDK
        run: |
          winget install --id LunarG.VulkanSDK --exact --source winget `
            --accept-source-agreements --accept-package-agreements --silent

          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName "Include\vulkan\vulkan.h") } |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Vulkan SDK installation completed, but no usable SDK was found under C:\VulkanSDK"
          }

          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Vulkan SDK: $($sdk.FullName)"

      - name: Configure CMake
        run: >-
          cmake -B Maaz_DriversUltimatePRO/MaazXGPU/Build
          -S Maaz_DriversUltimatePRO/MaazXGPU
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Release
        run: cmake --build Maaz_DriversUltimatePRO/MaazXGPU/Build --config Release --parallel

      - name: Prepare artifact
        run: |
          $source = "Maaz_DriversUltimatePRO/MaazXGPU"
          $build = Join-Path $source "Build"
          $artifact = "MaazXGPU_Full_Driver"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $names = @("MaazXGPU.dll", "MaazXGPU.lib", "MaazXGPU_Tray.exe")
          foreach ($name in $names) {
            $candidate = Get-ChildItem $build -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($candidate) {
              Copy-Item $candidate.FullName (Join-Path $artifact $name) -Force
            }
          }

          foreach ($file in @("driver.inf", "README.txt", "BUILD-INSTRUCTIONS.md")) {
            $candidate = Join-Path $source $file
            if (Test-Path $candidate) {
              Copy-Item $candidate $artifact -Force
            }
          }

          $files = @(Get-ChildItem $artifact -File)
          if ($files.Count -eq 0) {
            throw "No build artifacts were found under $build"
          }

          $files | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazXGPU_Full_Driver
          path: MaazXGPU_Full_Driver
          if-no-files-found: error
