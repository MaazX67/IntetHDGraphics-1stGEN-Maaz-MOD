name: Build MaazXGPU Full Driver

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate or install Vulkan SDK
        run: |
          function Find-VulkanSdk {
            $roots = @($env:VULKAN_SDK, "C:\VulkanSDK", "$env:ProgramFiles\VulkanSDK", "${env:ProgramFiles(x86)}\VulkanSDK")
            foreach ($root in $roots) {
              if (-not $root -or -not (Test-Path $root)) { continue }
              $items = @(Get-Item $root -ErrorAction SilentlyContinue) + @(Get-ChildItem $root -Directory -ErrorAction SilentlyContinue)
              foreach ($item in $items) {
                if (Test-Path (Join-Path $item.FullName "Include\vulkan\vulkan.h")) { return $item.FullName }
              }
            }
            return $null
          }

          $sdk = Find-VulkanSdk
          if (-not $sdk) {
            $version = "1.3.296.0"
            $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version.exe"
            $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
            Write-Host "Downloading official Vulkan SDK from $url"
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            if (-not (Test-Path $installer)) { throw "Vulkan SDK download failed" }

            $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($process.ExitCode)" }

            $sdk = Find-VulkanSdk
          }

          if (-not $sdk) { throw "No usable Vulkan SDK found after installation" }
          if (-not (Test-Path (Join-Path $sdk "Lib\vulkan-1.lib"))) { throw "Vulkan loader library is missing from $sdk" }

          "VULKAN_SDK=$sdk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Vulkan SDK: $sdk"

      - name: Configure CMake
        run: >-
          cmake -B Maaz_DriversUltimatePRO/MaazXGPU/Build
          -S Maaz_DriversUltimatePRO/MaazXGPU
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Release
        run: cmake --build Maaz_DriversUltimatePRO/MaazXGPU/Build --config Release --parallel

      - name: Prepare artifact
        run: |
          $source = "Maaz_DriversUltimatePRO/MaazXGPU"
          $build = Join-Path $source "Build"
          $artifact = "MaazXGPU_Full_Driver"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          foreach ($name in @("MaazXGPU.dll", "MaazXGPU.lib", "MaazXGPU_Tray.exe")) {
            $candidate = Get-ChildItem $build -Recurse -File -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { Copy-Item $candidate.FullName (Join-Path $artifact $name) -Force }
          }
          foreach ($file in @("driver.inf", "README.txt", "BUILD-INSTRUCTIONS.md")) {
            $candidate = Join-Path $source $file
            if (Test-Path $candidate) { Copy-Item $candidate $artifact -Force }
          }
          $files = @(Get-ChildItem $artifact -File)
          if ($files.Count -eq 0) { throw "No build artifacts were found under $build" }
          $files | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazXGPU_Full_Driver
          path: MaazXGPU_Full_Driver
          if-no-files-found: error
